# GET/HEAD only: mempool's POST /api/tx and /api/v1/tx/push would broadcast through our node.
# Two names, told apart by the Host the USA edge passes on: fork.ecpool.tech gets the fork watch server (bottom);
# everything else (explorer.ecpool.tech, and the box's own address for health checks) gets the explorer.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
server {
    listen 8080 default_server;
    server_tokens off;
    # gzip runs after sub_filter, so the page's injected tags still work.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 2;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    # Docker's DNS, looked up per request: nginx must not die or go stale when web restarts.
    resolver 127.0.0.11 valid=30s ipv6=off;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 403;
    }
    # backend-info: host name + OS version. historical-price: no ECX price history.
    # The web image also maps /api/x to /api/v1/x.
    location ~* ^/api/(v1/)?(historical-price|backend-info) {
        return 404;
    }
    location = /fw-mempool.css {
        root /usr/share/nginx/fw;
        add_header Cache-Control "no-cache";
    }
    location = /fw-bar.js {
        root /usr/share/nginx/fw;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
        sub_filter_types application/javascript;
        sub_filter "location.hostname.indexOf('mempool.') === 0" "true";
        # 11-07: fw-bar.js now names explorer.ecpool.tech (was mempool.ecpool.tech); kept relative here.
        sub_filter "https://explorer.ecpool.tech/resources/mining-pools/" "/resources/mining-pools/";
        sub_filter_once off;
    }
    # ECX price for the pill and for the api's price-updater.js
    location = /fw-market.json {
        resolver_timeout 5s;
        set $fw_pool https://ecpool.tech;
        rewrite ^ /api/pool/market? break;
        proxy_pass $fw_pool;
        proxy_set_header Host ecpool.tech;
        proxy_set_header Cookie "";
        proxy_ssl_server_name on;
        proxy_ssl_name ecpool.tech;
        # A fake price must not pass (security review 2026-11-05), and visitor headers stay here.
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_pass_request_headers off;
        proxy_read_timeout 10s;
        proxy_hide_header Set-Cookie;
    }
    location / {
        set $fw_web web:8080;
        proxy_pass http://$fw_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        # uncompressed, so sub_filter can see the HTML
        proxy_set_header Accept-Encoding "";
        sub_filter '</body>' '<script src="/fw-bar.js" defer></script></body>';
        sub_filter '</head>' '<link href="/fw-mempool.css" rel="stylesheet"></head>';
        sub_filter_once on;
    }
}

# ECX fork watch (fork-observer, project ~/fork-watch, Docker name forkwatch on the egress network), 2026-11-07.
# GET/HEAD only, the ECX Fork Watch skin and the price bar. Per-visitor limits and the cache are on the public edge.
# fork-observer's HTML has no cache headers, so a browser could keep a pre-skin copy: HTML gets no-cache.
map $sent_http_content_type $fw_html_cc {
    ~*^text/html "no-cache";
    default      "";
}
# One key for all visitors: a total cap. Everything arrives from the edge, one address, anyway.
map $remote_addr $fw_all { default all; }
limit_conn_zone $fw_all zone=fw_sse:1m;
server {
    listen 8080;
    server_name fork.ecpool.tech;
    server_tokens off;
    gzip on;
    gzip_proxied any;
    gzip_comp_level 2;
    gzip_min_length 1024;
    # Not text/event-stream: gzip would hold back the live feed.
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    resolver 127.0.0.11 valid=30s ipv6=off;
    limit_conn_status 429;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 403;
    }
    # Live change feed (server-sent events, held open): no buffering. A total cap, same as the edge's websocket cap.
    location = /api/changes {
        limit_conn fw_sse 300;
        set $fw_fork forkwatch:2323;
        proxy_pass http://$fw_fork;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location = /fw-bar.js {
        root /usr/share/nginx/fw;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }
    # Skin: stylesheet + the official eCash mark
    location ~ ^/fw-(theme\.css|ecash-mark\.svg|forkwatch-logo\.png)$ {
        root /usr/share/nginx/fw;
        add_header Cache-Control "no-cache";
    }
    # The price bar's data: the explorer server above already fetches and checks it.
    location = /fw-market.json {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host localhost;
        proxy_read_timeout 15s;
    }
    location / {
        set $fw_fork forkwatch:2323;
        proxy_pass http://$fw_fork;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        # uncompressed, so sub_filter can see the HTML
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 30s;
        add_header Cache-Control $fw_html_cc always;
        sub_filter '</body>' '<script src="/fw-bar.js" defer></script></body>';
        # skin: dark always, our stylesheet, name + eCash mark in the header (each string once per page)
        sub_filter '<html>' '<html class="dark">';
        sub_filter '</head>' '<link href="/fw-theme.css" rel="stylesheet"></head>';
        sub_filter '<title>fork-observer' '<title>eCPool Fork Watch';
        sub_filter '<img src="static/img/logo.svg" width="30" height="30" class="d-inline-block align-top invert" alt="">' '<img src="/fw-forkwatch-logo.png" class="fw-logo" height="48" alt="eCPool Fork Watch">';
        sub_filter '<span class="fw-semibold">fork-observer</span>' '';
        sub_filter '<a class="navbar-brand d-flex align-items-center gap-2 m-0" href="/">' '<a class="navbar-brand d-flex align-items-center gap-2 m-0" href="https://ecash.com/" target="_blank" rel="noopener" title="eCash (ECX), ecash.com">';
        sub_filter_once on;
    }
}
